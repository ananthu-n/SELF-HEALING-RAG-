project:
  name: Self-Healing Research Assistant

storage:
  raw_pdf_dir: data/raw_pdfs
  processed_dir: data/processed
  metadata_dir: data/metadata
  chunks_dir: data/chunks      # rename chunk_dir -> chunks_dir

knowledge:
  source: arxiv
  max_results: 5
  cache_days: 30
  dynamic_fetch: true
  download_pdf: true
  incremental_indexing: true

arxiv:
  queries:
    - Retrieval Augmented Generation
  papers_per_query: 1

chunking:
  chunk_size: 1000
  chunk_overlap: 200           # rename overlap -> chunk_overlap

# ---------------------------------------------------------
# Embedding Configuration
# ---------------------------------------------------------

embedding:

  model_name: "BAAI/bge-large-en-v1.5"

  device: "cpu"

  batch_size: 64

  normalize: true

  precision: "float32"

  embeddings_dir: "data/embeddings"

  metadata_dir: "data/embedding_metadata"

vectorstore:
  provider: "qdrant"
  location: "data/qdrant"
  collection_name: "research_assistant"
  distance: "cosine"
  vector_size: 1024

reranker:

  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"

  device: "cpu"

  batch_size: 32

  max_length: 512

  normalize_scores: true

prompt:
  max_chunks: 5
  max_context_characters: 12000
  include_metadata: true


llm:
  provider: groq
  model: llama-3.3-70b-versatile
  base_url: https://api.groq.com/openai/v1
  temperature: 0.0
  timeout: 120
  grounding_model: llama-3.3-70b-versatile

self_healing:
  enabled: true
  max_retries: 2
  confidence_threshold: 0.80