version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: selfrag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: selfrag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selfrag_api
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - .:/app
    command: python -u -m uvicorn app.api.server:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - qdrant
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
